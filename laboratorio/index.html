<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#104c58">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Laboratório MusicXML</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/jszip-3.10.1.min.js"></script>
  <script defer src="vendor/opensheetmusicdisplay-1.9.3.min.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="app.js"></script>
  <script defer src="offline.js"></script>
</head>
<body>
  <main class="wrap">
    <p id="status" role="status" aria-live="polite">Carregando partitura…</p>
    <noscript>Ative o JavaScript para carregar e reproduzir a partitura.</noscript>
    <section class="panel score-panel" aria-labelledby="scoreHeading">
      <div class="transport" id="transport">
        <div class="toolbar">
          <h1 id="scoreHeading">Partitura</h1>
          <div class="transport-buttons">
            <button id="play" class="primary" type="button" disabled>Play</button>
            <button id="stop" type="button" disabled>Stop</button>
          </div>
        </div>
        <p id="playing" class="live" role="status">Pronto para tocar</p>
      </div>
      <div id="score" tabindex="0" aria-label="Partitura musical"></div>
    </section>
    <section class="panel" aria-labelledby="controlsHeading">
      <h2 id="controlsHeading">Ajustes</h2>
      <div class="transport-grid">
        <label>Andamento <span class="range-control"><input id="tempo" type="range" min="30" max="240" step="1" value="120"><output id="tempoOut">120 BPM</output></span></label>
        <label>Volume <span class="range-control"><input id="masterVolume" type="range" min="0" max="100" value="80" step="5"><output id="masterVolumeOut">80%</output></span></label>
      </div>
        <div class="controls zoom-controls">
          <button id="zoomMinus" type="button" disabled aria-label="Reduzir partitura">−</button>
          <label>Zoom <input id="zoom" type="range" min="50" max="200" step="10" value="80" disabled><output id="zoomOut">80%</output></label>
          <button id="zoomPlus" type="button" disabled aria-label="Ampliar partitura">+</button>
          <button id="resetZoom" type="button" disabled>Restaurar</button>
        </div>
    </section>
    <details class="panel options-panel">
      <summary>Som e opções de reprodução</summary>
      <div class="option-grid">
        <label>Reproduzir <select id="playbackMode">
          <option value="both">Melodia e harmonia</option>
          <option value="melody">Somente melodia</option>
          <option value="harmony">Somente harmonia</option>
        </select></label>
        <label>Melodia <select id="track" disabled></select></label>
        <label>Som da melodia <select id="timbre">
          <option value="piano">Piano acústico · Salamander</option>
          <option value="electric">Piano elétrico · cristalino</option>
          <option value="flute">Flauta · expressiva</option>
          <option value="sine">Senoidal · referência simples</option>
        </select></label>
        <label>Som da harmonia <select id="harmonyTimbre">
          <option value="piano">Piano acústico · Salamander</option>
          <option value="electric">Piano elétrico · cristalino</option>
        </select></label>
        <label>Brilho <span class="range-control"><input id="brightness" type="range" min="0" max="100" value="65" step="5"><output id="brightnessOut">65%</output></span></label>
        <label>Volume da harmonia <span class="range-control"><input id="harmonyVolume" type="range" min="0" max="100" step="5" value="45"><output id="harmonyVolumeOut">45%</output></span></label>
        <label class="checkbox-label"><input id="followCursor" type="checkbox" checked> Acompanhar cursor com rolagem</label>
      </div>
    </details>
    <button id="updateApp" class="update-button" type="button" hidden>Atualizar</button>
    <footer class="credits">Piano: Salamander Grand Piano, de Alexander Holm · <a href="audio/piano/CREDITOS.txt">Créditos e licença CC BY 3.0</a></footer>
  </main>
</body>
</html>
